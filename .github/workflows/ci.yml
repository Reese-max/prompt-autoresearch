name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.id }} (${{ matrix.os }}, Python ${{ matrix.python_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: L310
            os: ubuntu-latest
            platform: Linux
            python_version: "3.10"
          - id: L311
            os: ubuntu-latest
            platform: Linux
            python_version: "3.11"
          - id: L312
            os: ubuntu-latest
            platform: Linux
            python_version: "3.12"
          - id: M311
            os: macos-latest
            platform: macOS
            python_version: "3.11"
          - id: W311
            os: windows-latest
            platform: Windows
            python_version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Record environment
        run: |
          python --version
          python -m pip --version
          python -c "import platform, sys; print(f'RUNNER_OS={platform.system()}'); print(f'PYTHON_EXECUTABLE={sys.executable}'); print(f'PYTHON_VERSION={platform.python_version()}')"
      - name: Run ${{ matrix.id }} test matrix
        run: |
          python -c "print('TEST_COMMAND=python scripts/run_test_matrix.py --platform ${{ matrix.platform }} --python-version ${{ matrix.python_version }}')"
          python scripts/run_test_matrix.py --platform ${{ matrix.platform }} --python-version ${{ matrix.python_version }}
      # 驗收閘門：覆蓋率只計 scripts/ 與 api/，不得混入 lib/ 拉高總覆蓋率。
      # pytest.ini 的 addopts 含 --cov=lib，故以 -o addopts= 覆蓋後再明確指定範圍。
      - name: Coverage gate (scripts + api only, >=80%)
        if: matrix.id == 'L311'
        run: >
          python -m pytest tests -o addopts=
          --cov=scripts --cov=api
          --cov-report=term-missing
          --cov-report=xml --cov-report=html
          --cov-fail-under=80
      - name: Upload coverage reports
        if: always() && matrix.id == 'L311'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.id }}
          path: |
            coverage.xml
            htmlcov/
